[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "laya-decision-sidecar"
version = "0.1.0"
description = "Privacy-bound JSONL sidecar for Laya decisions"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
laya = ["laya"]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
